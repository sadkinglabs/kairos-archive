# The query API Worker. Deployed by .github/workflows/deploy-query.yml on
# every push to main that touches worker/ or src/search/, with the
# Cloudflare token and account id in repository secrets; or by hand with
# `npx wrangler deploy --config worker/wrangler.toml`.
name = "kairos-query"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# On the API domain, beside the static objects. The route covers only
# /cards and what is under it; /v3/… and /versions.json keep going to
# the bucket. Remove the routes to serve from the workers.dev address.
routes = [
  { pattern = "api.kairosarchive.net/cards", zone_name = "kairosarchive.net" },
  { pattern = "api.kairosarchive.net/cards/*", zone_name = "kairosarchive.net" },
]

[vars]
SITE_BASE_URL = "https://kairosarchive.net"
API_BASE_URL = "https://api.kairosarchive.net"

[observability]
enabled = true
