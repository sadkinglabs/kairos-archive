# The stats Worker: counts outbound clicks and searches from the site (POST /event)
# and serves the usage dashboard (GET /) to the owner, behind Cloudflare
# Access. Deployed by .github/workflows/deploy-stats.yml; or by hand with
# `npx wrangler deploy --config stats/wrangler.toml`.
name = "kairos-stats"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Its own hostname on the zone; deploying creates the DNS record. The
# Cloudflare Access application for this hostname is set up in the
# Zero Trust dashboard (see README); the Worker checks the Access token
# on every dashboard request as well, so a missing policy fails closed.
routes = [{ pattern = "stats.kairosarchive.net", custom_domain = true }]

# Plain configuration. Secrets, set by the deploy workflow from GitHub
# secrets: CF_API_TOKEN (Account Analytics Read + Zone Analytics Read),
# CF_ACCOUNT_ID, CF_ZONE_ID, ACCESS_TEAM_DOMAIN, ACCESS_AUD,
# DISCORD_BOT_TOKEN.
[vars]
SITE_BASE_URL = "https://kairosarchive.net"
API_HOST = "api.kairosarchive.net"
QUERY_HOST = "query.kairosarchive.net"
BOT_HOST = "bot.kairosarchive.net"
SITE_HOST = "kairosarchive.net"
STATS_HOST = "stats.kairosarchive.net"

[observability]
enabled = true

# Outbound clicks and searches from the site land here; the bot and the query API
# write their own datasets (kairos_bot, kairos_query), which the
# dashboard reads through the SQL API.
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "kairos_site"
