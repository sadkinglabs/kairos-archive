name: deploy-query

# Deploys the query API Worker (worker/) from GitHub: on every push to
# main that touches the Worker or the search grammar it is built on, and
# on demand. Wrangler reads CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# from repository secrets; without them the job says so and stops, so a
# push never fails for want of setup.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", "src/search/**", "src/data/paths.ts", ".github/workflows/deploy-query.yml"]

permissions:
  contents: read

concurrency:
  group: deploy-query
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker:check
      - run: npx vitest run worker
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          npm run worker:deploy
      - name: Check the deployed API answers
        if: env.skip != 'true'
        run: |
          sleep 5
          curl -sS --fail --max-time 20 -A "kairos-archive-ci (+https://kairosarchive.net)" \
            'https://api.kairosarchive.net/cards?q=t:minion&page_size=1' | head -c 400
          echo
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "kairos-archive-ci (+https://kairosarchive.net)" 'https://api.kairosarchive.net/cards/nope')
          echo "unknown path: HTTP $code (404 expected)"
          [ "$code" = "404" ]
