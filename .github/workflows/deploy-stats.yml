name: deploy-stats

# Deploys the stats Worker (stats/) from GitHub: on every push to main
# that touches it, and on demand. Wrangler reads CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID from repository secrets; the Worker's own secrets
# are pushed from GitHub secrets on each run, each one skipped when
# unset, so the Worker can be deployed before the dashboard is
# configured (it then fails closed: 403 on /, 503 once Access passes).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["stats/**", ".github/workflows/deploy-stats.yml"]

permissions:
  contents: read

concurrency:
  group: deploy-stats
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run stats:check
      - run: npx vitest run stats
      - name: Prove the zone still answers the dashboard's query
        # Every zone table shares one GraphQL request, so a field this
        # plan refuses fails all of them. Catch that here, with the same
        # credentials the Worker uses, rather than on the live page.
        # Without the secrets the test skips and the deploy carries on.
        env:
          CF_API_TOKEN: ${{ secrets.STATS_CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx vitest run stats/test/zone-live.test.ts
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          npm run stats:deploy
      - name: Set the Worker's secrets
        if: env.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Worker's names on the left, the GitHub secrets on the right.
          W_CF_API_TOKEN: ${{ secrets.STATS_CF_API_TOKEN }}
          W_CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          W_CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          W_ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          W_ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          W_DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          for name in CF_API_TOKEN CF_ACCOUNT_ID CF_ZONE_ID ACCESS_TEAM_DOMAIN ACCESS_AUD DISCORD_BOT_TOKEN; do
            var="W_$name"
            value="${!var}"
            if [ -z "$value" ]; then echo "$name: no GitHub secret; left as is."; continue; fi
            printf '%s' "$value" | npx wrangler secret put "$name" --config stats/wrangler.toml
          done
      - name: Check the deployed Worker answers
        if: env.skip != 'true'
        run: |
          set -o pipefail
          for i in $(seq 1 12); do
            if curl -sS --fail --max-time 20 https://stats.kairosarchive.net/health; then break; fi
            sleep 5
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://stats.kairosarchive.net/)
          echo "dashboard without Access: HTTP $code (403, or 302 to the Access login, expected)"
          case "$code" in 302|403) ;; *) exit 1;; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://evil.example' -d '{}' https://stats.kairosarchive.net/event)
          echo "beacon from another origin: HTTP $code (403 expected)"
          [ "$code" = "403" ]
          # One synthetic event from the site's origin: proves the route
          # accepts and records a beacon (204). It lands in the dataset as
          # a click from a page called /_deploy-check, easy to filter.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'origin: https://kairosarchive.net' -H 'content-type: text/plain' \
                 -d '{"h":"deploy-check.invalid","p":"/_deploy-check","t":"deploy-check"}' https://stats.kairosarchive.net/event)
          echo "beacon from the site: HTTP $code (204 expected)"
          [ "$code" = "204" ]
