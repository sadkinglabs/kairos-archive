name: ci

# Every push and pull request: lint, type-check, unit tests (the search
# grammar and the query Worker), the Worker's type-check and dry-run
# bundle, then a real build against the newest verified registry release
# on api.kairosarchive.net - the same thing Cloudflare Pages does.
#
# Both type checkers run, because they see different files. tsc reads the
# .ts modules and ignores .astro entirely; astro check reads the templates,
# their frontmatter and their expressions. A type error inside a component
# passes tsc and fails astro check, so without this step one could reach
# main unnoticed.

on:
  push:
    branches: [main]
  pull_request:

# The check needs to read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore verified registry downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules/.cache/kairos-registry
          key: registry-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: registry-v1-${{ runner.os }}-
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run check   # astro check: the .astro templates tsc cannot see
      - run: npm test
      - run: npm run worker:check   # the query Worker's own tsconfig (workers-types, not node)
      - run: npm run worker:bundle  # a dry-run deploy: what would be uploaded
      - run: npm run stats:check    # the stats Worker (stats/), the same way
      - run: npm run stats:bundle
      - run: npm run build
      - name: Summary
        run: |
          echo "pages: $(find dist -name '*.html' | wc -l)"
          du -sh dist
