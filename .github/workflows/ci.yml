name: ci

# Every push and pull request: lint, type-check, unit tests (the search
# grammar), then a real build against the newest verified registry
# release on api.kairosarchive.net - the same thing Cloudflare Pages does.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build
      - name: Summary
        run: |
          echo "pages: $(find dist -name '*.html' | wc -l)"
          du -sh dist
