name: probe-zone

# Asks the real zone the dashboard's own GraphQL question and reports
# which tables it refuses. Read-only: it deploys nothing and changes
# nothing. Push a branch named probe/something to run it before merging
# a change to the query, because a field the plan refuses fails the
# whole request and every table with it.

on:
  workflow_dispatch:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ask the zone
        env:
          CF_API_TOKEN: ${{ secrets.STATS_CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then
            echo "::error::STATS_CF_API_TOKEN or CF_ZONE_ID is not set; nothing was asked."
            exit 1
          fi
          npx vitest run stats/test/zone-live.test.ts
