# Keeps the pins fresh: one pull request per update, weekly, for the
# Actions the workflows run (pinned to commits) and the npm packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    ignore:
      # @types/node tracks the Node the site runs on (22 in CI and on Pages);
      # a newer major would type APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @astrojs/check accepts TypeScript 5 and 6 only; lift when it takes 7.
      - dependency-name: "typescript"
        versions: [">=7"]
